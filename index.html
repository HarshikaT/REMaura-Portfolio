<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMaura</title>
<style>
  :root {
    --cream: #F2E8D8;
    --cream-warm: #EEDFC7;
    --navy: #0D1B2A;
    --navy-deep: #08111C;
    --ink: #2A2118;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  /* NAVBAR */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
    background: var(--cream);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    color: var(--navy);
  }

  .logo img {
    width: 40px;
    height: auto;
    filter: drop-shadow(0 1px 2px rgba(13,27,42,0.15));
  }

  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }

  .nav-links li {
    font-size: 0.9rem;
    font-weight: 500;
  }

  .nav-links a {
    color: var(--ink);
    text-decoration: none;
    opacity: 0.65;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .nav-links a:hover { opacity: 1; }

  /* HERO */
  .hero-wrap {
    padding: 8px 32px 40px;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 82vh;
    border-radius: 32px;
    overflow: hidden;
    background-color: var(--navy-deep);
  }

  .hero img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 60%;
  }

  /* moody navy color-grade wash over the photo, ties it to the palette */
  .hero .grade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(8,17,28,0.55) 0%, rgba(8,17,28,0.05) 30%, rgba(8,17,28,0.15) 60%, rgba(6,12,22,0.85) 100%),
      linear-gradient(100deg, rgba(13,27,42,0.35) 0%, rgba(13,27,42,0) 45%);
    mix-blend-mode: multiply;
  }

  .hero .tint {
    position: absolute;
    inset: 0;
    background: rgba(19,43,66,0.28);
  }

  .hero-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 56px;
  }

  .hero-content h1 {
    color: var(--cream);
    font-size: clamp(2.2rem, 5vw, 4rem);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.02em;
    max-width: 700px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.25);
  }

  .hero-content p {
    color: rgba(242, 232, 216, 0.75);
    font-size: 1.05rem;
    margin-top: 16px;
    max-width: 480px;
  }

  @media (max-width: 700px) {
    nav { padding: 20px 24px; }
    .nav-links { display: none; }
    .hero-wrap { padding: 4px 16px 28px; }
    .hero { height: 70vh; }
    .hero-content { padding: 32px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">
    <img src="assets/fish-logo.png" alt="REMaura fish logo">
    REMaura
  </div>
  <ul class="nav-links">
    <li><a href="#">Tab 1</a></li>
    <li><a href="#">Tab 2</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="#">Tab 4</a></li>
    <li><a href="#">Tab 5</a></li>
    <li><a href="#">Tab 6</a></li>
  </ul>
</nav>

<div class="hero-wrap">
  <div class="hero">
    <img class="bg" src="assets/ocean.jpg" alt="Deep blue ocean">
    <div class="grade"></div>
    <div class="tint"></div>
    <div class="hero-content">
      <h1>Rest, measured.</h1>
      <p>REMaura placeholder subhead — swap this for your actual product description.</p>
    </div>
  </div>
</div>

</body>
</html>
